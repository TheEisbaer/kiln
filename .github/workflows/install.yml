# The fresh-install test: check/in-image --install-only follows
# docs/getting-started.md for a new instance on this runner's engine, and
# takes one card from posting to merged (ADR 0061). It runs on a pull request
# that touches the guide or what an install builds and runs, and on every push
# to main, so that a change elsewhere that breaks an install shows there. It is
# not part of the required check: the job check of check.yml does not wait for
# it (ADR 0049).
name: install

on:
  pull_request:
    paths:
      - docs/getting-started.md
      - scripts/**
      - images/**
      - cmd/**
      - check/**
      - go.mod
      - .github/workflows/install.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    # As in check.yml: the caches are restored, never saved.
    cache-mode: read
    # Stays above check/in-image's -test.timeout for TestFreshInstall, with room for the steps before the test.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain image and Go's build cache, as in check.yml, for
      # compiling the test. The test then removes every kiln-* image, so the
      # guide's build starts without them.
      - id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain.tar
          key: toolchain-${{ hashFiles('go.mod', 'go.sum', 'images/toolchain/Dockerfile') }}
      - if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          docker load --quiet --input "$RUNNER_TEMP/toolchain.tar" ||
              echo "::warning::the cached toolchain image did not load; check/in-image builds it"
          rm -f "$RUNNER_TEMP/toolchain.tar"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-${{ hashFiles('images/toolchain/Dockerfile') }}-${{ github.sha }}
          restore-keys: go-build-${{ hashFiles('images/toolchain/Dockerfile') }}-
      - run: check/in-image --install-only
        env:
          KILN_GO_CACHE: ${{ runner.temp }}/go-build
